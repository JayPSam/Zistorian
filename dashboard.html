
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZISTORIAN | Owner Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 22px 20px;
            background: #0b0b0b;
            border-bottom: 1px solid #2d2612;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .owner {
            color: #888;
            font-size: 12px;
            text-align: right;
        }

        main {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 25px 18px 50px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            color: #888;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .stat {
            background: #101010;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
        }

        .stat strong {
            display: block;
            color: #d4af37;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .stat span {
            color: #777;
            font-size: 11px;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid #29230f;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .card h2 {
            margin: 0 0 20px;
            font-size: 20px;
            color: #d4af37;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 13px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #333;
            background: #151515;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #d4af37;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #d4af37;
            color: #050505;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .ticket {
            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 17px;
            margin-bottom: 12px;
        }

        .ticket h3 {
            margin: 0 0 8px;
        }

        .ticket-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            color: #999;
            font-size: 13px;
        }

        .ticket-code {
            margin-top: 12px;
            padding: 11px;
            background: #181818;
            border-radius: 7px;
            color: #d4af37;
            font-family: monospace;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        ZISTORIAN
    </div>

    <div class="owner">
        OWNER DASHBOARD<br>
        MR BHONYINGTON
    </div>
</header>

<main>

    <section class="welcome">
        <h1>Welcome, Mr Bhonyington</h1>
        <p>Manage your soccer betting tickets.</p>
    </section>

    <section class="stats">

        <div class="stat">
            <strong id="activeCount">0</strong>
            <span>ACTIVE</span>
        </div>

        <div class="stat">
            <strong id="expiredCount">0</strong>
            <span>EXPIRED</span>
        </div>

        <div class="stat">
            <strong>R0</strong>
            <span>SALES</span>
        </div>

    </section>

    <section class="card">

        <h2>Add New Ticket</h2>

        <form id="ticketForm">

            <div class="field">
                <label for="title">Ticket Name</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Weekend Special"
                    required
                >
            </div>

            <div class="field">
                <label for="ticketCode">Ticket Code</label>

                <input
                    type="text"
                    id="ticketCode"
                    placeholder="Enter ticket code"
                    required
                >
            </div>

            <div class="row">

                <div class="field">
                    <label for="odds">Odds</label>

                    <input
                        type="number"
                        id="odds"
                        step="0.01"
                        placeholder="38.50"
                        required
                    >
                </div>

                <div class="field">
                    <label for="price">Price (R)</label>

                    <input
                        type="number"
                        id="price"
                        step="0.01"
                        placeholder="50"
                        required
                    >
                </div>

            </div>

            <div class="row">

                <div class="field">
                    <label for="firstGame">First Game</label>

                    <input
                        type="datetime-local"
                        id="firstGame"
                        required
                    >
                </div>

                <div class="field">
                    <label for="lastGame">Last Game</label>

                    <input
                        type="datetime-local"
                        id="lastGame"
                        required
                    >
                </div>

            </div>

            <div class="field">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    placeholder="Ticket information..."
                ></textarea>
            </div>

            <button type="submit" id="publishButton">
                PUBLISH TICKET
            </button>

            <div id="message"></div>

        </form>

    </section>

    <section class="card">

        <h2>Current Tickets</h2>

        <div id="ticketList">
            <div class="empty">
                Loading tickets...
            </div>
        </div>

    </section>

</main>

<script>

    const SUPABASE_URL =
        "https://qhblzsqcvykfwobdcqsn.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_aJe-IKXMJB_9wl_6sD62SA_dPZcu49M";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    async function checkLogin() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "login.html";
            return false;
        }

        return true;
    }


    async function loadTickets() {

        const {
            data,
            error
        } = await supabaseClient
            .from("tickets")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {

            console.error(error);

            document.getElementById("ticketList").innerHTML =
                '<div class="empty">Unable to load tickets.</div>';

            return;
        }

        const now = new Date();

        let active = 0;
        let expired = 0;

        data.forEach(ticket => {

            if (
                ticket.status === "active" &&
                new Date(ticket.last_game_at) > now
            ) {
                active++;
            } else {
                expired++;
            }

        });

        document.getElementById("activeCount").textContent = active;
        document.getElementById("expiredCount").textContent = expired;


        if (data.length === 0) {

            document.getElementById("ticketList").innerHTML =
                '<div class="empty">No tickets yet.</div>';

            return;
        }


        document.getElementById("ticketList").innerHTML =
            data.map(ticket => {

                const lastGame =
                    new Date(ticket.last_game_at);

                const isActive =
                    ticket.status === "active" &&
                    lastGame > now;

                return `
                    <div class="ticket">

                        <h3>${escapeHtml(ticket.title)}</h3>

                        <div class="ticket-info">

                            <div>
                                Odds: ${ticket.odds}
                            </div>

                            <div>
                                Price: R${ticket.price}
                            </div>

                            <div>
                                First game:
                                ${formatDate(ticket.first_game_at)}
                            </div>

                            <div>
                                Last game:
                                ${formatDate(ticket.last_game_at)}
                            </div>

                        </div>

                        <div class="ticket-code">
                            ${escapeHtml(ticket.ticket_code)}
                        </div>

                        <p style="color:#888;">
                            Status:
                            ${isActive ? "ACTIVE" : "EXPIRED"}
                        </p>

                    </div>
                `;

            }).join("");

    }


    document
        .getElementById("ticketForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const button =
                document.getElementById("publishButton");

            const message =
                document.getElementById("message");

            const firstGame =
                new Date(
                    document.getElementById("firstGame").value
                );

            const lastGame =
                new Date(
                    document.getElementById("lastGame").value
                );


            if (lastGame <= firstGame) {

                message.style.color = "#ff7777";

                message.textContent =
                    "Last game must be after the first game.";

                return;
            }


            button.disabled = true;
            button.textContent = "PUBLISHING...";

            message.textContent = "";


            const ticket = {

                title:
                    document.getElementById("title").value.trim(),

                ticket_code:
                    document.getElementById("ticketCode").value.trim(),

                odds:
                    parseFloat(
                        document.getElementById("odds").value
                    ),

                price:
                    parseFloat(
                        document.getElementById("price").value
                    ),

                description:
                    document.getElementById("description").value.trim(),

                first_game_at:
                    firstGame.toISOString(),

                last_game_at:
                    lastGame.toISOString(),

                status: "active"

            };


            const {
                error
            } = await supabaseClient
                .from("tickets")
                .insert(ticket);


            if (error) {

                console.error(error);

                message.style.color = "#ff7777";

                message.textContent =
                    error.message;

                button.disabled = false;
                button.textContent = "PUBLISH TICKET";

                return;
            }


            message.style.color = "#7cff9b";

            message.textContent =
                "Ticket published successfully.";

            document
                .getElementById("ticketForm")
                .reset();

            button.disabled = false;
            button.textContent = "PUBLISH TICKET";

            loadTickets();

        });


    function formatDate(dateString) {

        return new Date(dateString).toLocaleString(
            "en-ZA",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    }


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    async function startDashboard() {

        const loggedIn = await checkLogin();

        if (!loggedIn) {
            return;
        }

        loadTickets();

    }


    startDashboard();

</script>

</body>
</html>
